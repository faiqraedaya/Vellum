[project]
name = "Vellum"
version = "2.0.0"
description = "Mark up images and PDFs with scaled measurements, annotations and contours."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fonttools>=4.66.1",
    "pymupdf>=1.27.2.3",
    "pyside6>=6.11.1",
    "shapely>=2.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vellum"]
